# hyprlock · gus
# An open ensō in the spirit of Hakuin around the time, on warm Gruvbox brown, all in Zen Old Mincho,
# and Musashi's last precept across the bottom, like the caption of a painting.
# Colors with # inside text are written as ## (hyprlang treats a single # as a comment).
# Font: Zen Old Mincho from Google Fonts, in ~/.local/share/fonts
# Sizes and positions are in logical pixels for 1920x1080 at scale 1.25, matching enso.png.

$bg = rgb(3c3836)
$mincho = Zen Old Mincho

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/gus/wallpapers/enso.png
    color = $bg
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb(ddc7a1)
    font_family = $mincho
    font_size = 96
    halign = center
    valign = center
    position = 0, 168
}

# Date in kanji, the weekday in the color of its element
label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/gus-date --lock
    font_family = $mincho
    font_size = 22
    halign = center
    valign = center
    position = 0, 70
}

# Password
input-field {
    monitor =
    size = 240, 38
    outline_thickness = 2
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgba(7daea366)
    inner_color = rgb(282828)
    font_color = rgb(d4be98)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(d8a657)
    fail_color = rgb(ea6962)
    capslock_color = rgb(e78a4e)
    fade_on_empty = false
    placeholder_text = <span foreground="##5a524c">password</span>
    fail_text = <span foreground="##ea6962">$FAIL</span>
    halign = center
    valign = center
    position = 0, -16
}

# Keiko in progress, empty when there is none
label {
    monitor =
    text = cmd[update:5000] ~/.local/bin/keiko status --pango
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    halign = center
    valign = center
    position = 0, -68
}

# 常に兵法の道を離れず · Never stray from the Way (Musashi, Dokkōdō, the last precept)
label {
    monitor =
    text = <span letter_spacing="10240">常に兵法の道を離れず</span>
    color = rgb(e2c08d)
    font_family = $mincho
    font_size = 32
    halign = center
    valign = bottom
    position = 0, 88
}
