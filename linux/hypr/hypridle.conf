# hypridle · gus
# 5 min idle: lock. 6 min: screen off. 30 min on battery: suspend.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -n1)" = 1 ] || systemctl suspend
}
