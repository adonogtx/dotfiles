# fuzzel · gus
# App launcher and the menus for power and clipboard, in the same panel style as the bar.

[main]
font = JetBrainsMono Nerd Font:size=12
prompt = "› "
icons-enabled = yes
icon-theme = Adwaita
width = 36
lines = 10
horizontal-pad = 18
vertical-pad = 14
inner-pad = 8
line-height = 22
layer = overlay
terminal = ghostty -e

[colors]
background = 282828ff
text = d4be98ff
prompt = d8a657ff
placeholder = 5a524cff
input = ddc7a1ff
match = d8a657ff
selection = 3c3836ff
selection-text = ddc7a1ff
selection-match = e78a4eff
border = 7daea38c

[border]
width = 2
radius = 12
