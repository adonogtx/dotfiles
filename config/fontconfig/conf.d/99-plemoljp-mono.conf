<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PlemolJP Console NF reports dual spacing (90) on most weights and none on Bold.
     Ghostty asks for a monospace font and ends up with Bold for every style.
     Marking the family monospace at scan time fixes it. Run fc-cache -fr after copying. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>PlemolJP Console NF</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
</fontconfig>
