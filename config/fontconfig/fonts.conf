<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ~/.config/fontconfig/fonts.conf · Takuya's family everywhere -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>IBM Plex Sans</family><family>IBM Plex Sans JP</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>IBM Plex Serif</family><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>PlemolJP Console NF</family><family>IBM Plex Mono</family><family>IBM Plex Sans JP</family></prefer>
  </alias>
</fontconfig>
