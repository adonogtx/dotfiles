# ~/.config/fuzzel/fuzzel.ini · Launcher look, until the Quickshell launcher exists
[main]
font=IBM Plex Sans:size=13
prompt="  "
icon-theme=WhiteSur-light
terminal=ghostty -e
layer=overlay
anchor=top
y-margin=160
width=44
lines=7
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=28

[colors]
background=ffffffff
text=1d1d1fff
prompt=6e6e73ff
placeholder=aeaeb2ff
input=1d1d1fff
match=007affff
selection=007affff
selection-text=ffffffff
selection-match=ffffffff
border=e0e0e4ff

[border]
width=1
radius=14
