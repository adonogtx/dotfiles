# ~/.config/fuzzel/fuzzel.ini · Spotlight look, until the Quickshell launcher exists
[main]
font=IBM Plex Sans:size=13
prompt="  "
icon-theme=WhiteSur-dark
terminal=ghostty -e
layer=overlay
anchor=top
y-margin=160
width=44
lines=7
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=28

[colors]
background=1f1f21ff
text=f5f5f7ff
prompt=98989dff
placeholder=636366ff
input=f5f5f7ff
match=0a84ffff
selection=0a84ffff
selection-text=ffffffff
selection-match=ffffffff
border=ffffff14

[border]
width=1
radius=14
