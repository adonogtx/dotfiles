# ~/.config/fuzzel/fuzzel.ini · Launcher look, until the Quickshell launcher exists
[main]
font=IBM Plex Sans:size=13
prompt="  "
icon-theme=WhiteSur-light
terminal=ghostty -e
layer=overlay
anchor=top
y-margin=160
width=44
lines=7
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=28

[colors]
background=0c0c0dff
text=8e8e93ff
prompt=8e8e93ff
placeholder=636366ff
input=f2f2f2ff
match=f2f2f2ff
selection=f2f2f2ff
selection-text=000000ff
selection-match=000000ff
border=2a2a2cff

[border]
width=1
radius=14
