# ~/.config/fuzzel/fuzzel.ini · Launcher look, until the Quickshell launcher exists
[main]
font=IBM Plex Sans:size=13
prompt="  "
icon-theme=WhiteSur-light
terminal=ghostty -e
layer=overlay
anchor=top
y-margin=160
width=44
lines=7
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=28

[colors]
background=0c0c0dff
text=8c8c8cff
prompt=8c8c8cff
placeholder=636366ff
input=d8d8d8ff
match=d8d8d8ff
selection=d8d8d8ff
selection-text=000000ff
selection-match=000000ff
border=2a2a2cff

[border]
width=1
radius=14
