# Lock screen, Light Solid (docs/desktop.md, Lock; colors from docs/theme.md).
# Everything on the centre axis, same skeleton as the boot screen.
# Offsets are logical pixels for the laptop panel at scale 1.25 (1536 x 864):
# the phrase's centre sits at 44% of the height, 52 px above the middle.
#   phrase centre  +52
#   caption        14 px below the phrase
#   field centre   120 px below the phrase's centre (-68)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/light-solid.png
    color = rgba(246, 246, 248, 1.0)  # bar
    blur_passes = 0
}

# 11月10日(火)  23:40
label {
    monitor =
    text = cmd[update:1000] echo "$(gus-jdate)  $(date +%H:%M)"
    color = rgba(110, 110, 115, 1.0)  # secondary
    font_family = IBM Plex Sans JP
    font_size = 14
    halign = center
    valign = top
    position = 0, -48
}

# 常に兵法の道を離れず, Musashi, Dokkodo, last precept. Yuji Syuku, drawn as an image.
image {
    monitor =
    path = ~/.config/hypr/musashi.png
    size = 61  # the shorter side in logical px: 76 / 1.25, so the 656 x 76 image shows 1:1 (sharp, 64 px brush like the boot phrase)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 0, 52
}

# Caption: top 14 px below the phrase (52 - 30.5 - 14 - 9.5)
label {
    monitor =
    text = Never stray from the Way.
    color = rgba(110, 110, 115, 1.0)  # secondary
    font_family = IBM Plex Sans
    font_size = 14
    halign = center
    valign = center
    position = 0, -2
}

input-field {
    monitor =
    size = 290, 42
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(224, 224, 228, 1.0)  # line
    inner_color = rgba(255, 255, 255, 1.0)  # panel
    font_color = rgba(29, 29, 31, 1.0)      # label
    font_family = IBM Plex Sans
    placeholder_text = <span foreground="##6e6e73">Enter Password</span>
    fail_text = Wrong password
    fail_color = rgba(215, 0, 21, 1.0)      # red
    check_color = rgba(0, 122, 255, 1.0)    # accent
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    halign = center
    valign = center
    position = 0, -68
}
