# Lock screen (docs/desktop.md, Lock; colors are the system tokens from docs/theme.md, Color: system).
# Date, clock and one password field over a fixed photo; its own screen, not the boot screen.
# The spec is in physical px on the 1920 x 1080 panel. hyprlock 0.9.7 at scale 1.25 takes
# positions and sizes in physical px (checked 2026-11-19), and font sizes in points:
# font_size = physical px * 0.75.
#   date centre    376 px above the screen centre
#   clock centre   228 px above the screen centre
#   field centre   401 px below the screen centre

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1200  # error border and placeholder for 1.2 s
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    animation = fadeIn, 1, 3, linear  # whole screen, 300 ms
}

# Fixed photo, 1920 x 1080, the same as the boot's background.png (lock-background.png).
background {
    monitor =
    path = ~/.config/hypr/lock-background.png
    color = rgba(0, 0, 0, 1.0)  # bar #000000, shown if the image is missing
    blur_passes = 0
}

# Date, 11月19日 木曜日, IBM Plex Sans JP Bold 41 physical.
label {
    monitor =
    text = cmd[update:60000] echo "<span font_weight='bold'>$(~/.local/bin/gus-jdate long)</span>"
    color = rgba(140, 140, 140, 1.0)  # secondary #8c8c8c
    font_family = IBM Plex Sans JP
    font_size = 31
    halign = center
    valign = center
    position = 0, 376
}

# Clock, 9:41, IBM Plex Sans SemiBold 228 physical, letter spacing -7 physical.
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='semibold' letter_spacing='-5376'>$(date +%-H:%M)</span>"
    color = rgba(216, 216, 216, 1.0)  # label #d8d8d8
    font_family = IBM Plex Sans
    font_size = 171
    halign = center
    valign = center
    position = 0, 228
}

# Field 336 x 58 physical, full radius, 2 px border; dots radius 7, 30 apart.
input-field {
    monitor =
    size = 336, 58
    rounding = -1
    outline_thickness = 2
    outer_color = rgba(42, 42, 44, 1.0)     # line #2a2a2c
    inner_color = rgba(12, 12, 13, 1.0)     # panel #0c0c0d
    font_color = rgba(216, 216, 216, 1.0)   # label #d8d8d8
    check_color = rgba(42, 42, 44, 1.0)     # line: no color change while checking
    fail_color = rgba(229, 72, 77, 1.0)     # red #e5484d
    font_family = IBM Plex Sans JP
    # placeholder and fail text in secondary #8c8c8c
    placeholder_text = <span font_size="18pt" foreground="##8c8c8c">パスワードを入力</span>
    fail_text = <span font_size="18pt" foreground="##8c8c8c">パスワードを入力</span>
    dots_size = 0.24      # 14 / 58: dot diameter as a share of the field height
    dots_spacing = 1.0    # gap as a share of the dot size; hyprlock caps it at 1.0 (28 apart, not 30)
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    halign = center
    valign = center
    position = 0, -401
}
