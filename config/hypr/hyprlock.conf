# Lock screen, Gruvbox (docs/desktop.md, Lock; colors from docs/theme.md).
# The same screen as the boot (config/plymouth/ichigo/ichigo.script): 一歩一歩 written
# vertically and one password field, both on the centre axis. No wallpaper, no date.
# Offsets are logical pixels for the laptop panel at scale 1.25 (1536 x 864); the boot
# script uses the same values in physical pixels (104 and 348).
#   column centre  83 px above the screen centre
#   field centre   278 px below the screen centre (its top 48 logical, 60 physical, below the column)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(29, 32, 33, 1.0)  # bar #1d2021
    blur_passes = 0
}

# 一歩一歩, Yuji Boku, phrase color, drawn as an image (200 x 732 physical).
image {
    monitor =
    path = ~/.config/hypr/ippo.png
    size = 160  # the smaller side in logical px: 200 / 1.25, so the image shows 1:1
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 0, 83
}

input-field {
    monitor =
    size = 290, 42
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(80, 73, 69, 1.0)     # line #504945
    inner_color = rgba(40, 40, 40, 1.0)     # panel #282828
    font_color = rgba(235, 219, 178, 1.0)   # label #ebdbb2
    font_family = IBM Plex Sans
    placeholder_text = <span foreground="##a89984">Enter Password</span>
    fail_text = Wrong password
    fail_color = rgba(251, 73, 52, 1.0)     # red #fb4934
    check_color = rgba(131, 165, 152, 1.0)  # accent #83a598
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    halign = center
    valign = center
    position = 0, -278
}
