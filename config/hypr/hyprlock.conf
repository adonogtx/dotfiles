# Lock screen, Dark Solid. Layout follows the deck at real size (the deck is 2x).
# Date 18, clock 100 light, Musashi in Japanese 28, English caption 14, one password field 290 x 42.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/dark-solid.png
    color = rgba(14, 14, 16, 1.0)
    blur_passes = 0
    brightness = 0.7
}

# 11月5日 木曜日
label {
    monitor =
    text = cmd[update:60000] gus-jdate long
    color = rgba(245, 245, 247, 0.8)
    font_family = IBM Plex Sans JP Medium
    font_size = 18
    halign = center
    valign = top
    position = 0, -140
}

# 18:57
label {
    monitor =
    text = $TIME
    color = rgba(245, 245, 247, 1.0)
    font_family = IBM Plex Sans Light
    font_size = 100
    halign = center
    valign = top
    position = 0, -168
}

# Musashi, Dokkodo, last precept. Thin spaces give the tracking.
label {
    monitor =
    text = 常 に 兵 法 の 道 を 離 れ ず
    color = rgba(245, 245, 247, 1.0)
    font_family = IBM Plex Sans JP
    font_size = 28
    halign = center
    valign = top
    position = 0, -348
}

label {
    monitor =
    text = Never stray from the Way.
    color = rgba(245, 245, 247, 0.6)
    font_family = IBM Plex Sans
    font_size = 14
    halign = center
    valign = top
    position = 0, -394
}

input-field {
    monitor =
    size = 290, 42
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.08)
    inner_color = rgba(31, 31, 33, 1.0)
    font_color = rgba(245, 245, 247, 1.0)
    font_family = IBM Plex Sans
    placeholder_text = <span foreground="##98989d">Enter Password</span>
    fail_text = Wrong password
    fail_color = rgba(255, 69, 58, 1.0)
    check_color = rgba(10, 132, 255, 1.0)
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    halign = center
    valign = bottom
    position = 0, 240
}
