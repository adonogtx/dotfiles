# ~/.config/mpv/script-opts/uosc.conf · thin line timeline, quiet top bar
timeline_style=line
timeline_line_width=2
top_bar=no-border
# Audio only files: keep the timeline and controls on screen instead of a black window.
timeline_persistency=paused,audio
controls_persistency=paused,audio
top_bar_persistency=paused,audio
# Black system (docs/theme.md, Color: system): panel bars with label text; the
# timeline fill and active items in label, text on them in text on accent;
# matches in accent; curtain in bar.
color=foreground=d8d8d8,foreground_text=000000,background=0c0c0d,background_text=d8d8d8,window_border=2a2a2c,curtain=000000,success=46a758,error=e5484d,match=d8d8d8,heatmap=d8d8d8
