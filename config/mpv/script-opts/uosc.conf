# ~/.config/mpv/script-opts/uosc.conf · thin line timeline, quiet top bar
timeline_style=line
timeline_line_width=2
top_bar=no-border
# Audio only files: keep the timeline and controls on screen instead of a black window.
timeline_persistency=paused,audio
controls_persistency=paused,audio
top_bar_persistency=paused,audio
# Light Solid (docs/theme.md): panel bars with label text; the timeline fill and
# active items in label (progress is not a selection); matches in accent.
color=foreground=1d1d1f,foreground_text=ffffff,background=ffffff,background_text=1d1d1f,window_border=e0e0e4,curtain=1d1d1f,success=248a3d,error=d70015,match=007aff,heatmap=007aff
