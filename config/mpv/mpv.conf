# ~/.config/mpv/mpv.conf
profile=high-quality
vo=gpu-next
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes

# uosc draws the interface; turn off the built in one
osc=no
osd-bar=no
border=no

# Subtitles: Japanese first
slang=ja,jpn,en,eng,pt-BR,pt
alang=ja,jpn,en,eng
sub-font="IBM Plex Sans JP"
sub-font-size=44
sub-border-size=2

screenshot-directory=~/media/pictures/screenshots
