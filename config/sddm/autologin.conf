# /etc/sddm.conf.d/autologin.conf (system file)
# Copy with your user name filled in:
#   sed "s/@USER@/$USER/" config/sddm/autologin.conf | sudo tee /etc/sddm.conf.d/autologin.conf
#
# One password per boot: Plymouth asks for LUKS, SDDM then opens Hyprland
# without a second prompt. hyprlock protects the running session.
# Without LUKS this file must not exist.

[Autologin]
User=@USER@
# The session file shipped by the hyprland package, not a hand written command.
Session=hyprland.desktop
# After Super + Shift + E, show the SDDM password screen instead of logging in again.
Relogin=false

[General]
# No virtual keyboard on the login screen.
InputMethod=
