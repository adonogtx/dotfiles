[colors]
background = #1d2021
background-alt = #282828
foreground = #ebdbb2
muted = #928374
red = #fb4934
green = #b8bb26
yellow = #fabd2f
blue = #83a598
workspace-active = #d7c5a7

[bar/main]
width = 100%
height = 32
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
border-size = 0
padding-right = 1

font-0 = Lilex Nerd Font:size=11;2
font-1 = Noto Sans CJK JP:size=11;2

padding-left = 0
module-margin-left = 0
module-margin-right = 1

modules-left = i3
modules-center = pomodoro date
modules-right = vpn containers volume network battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
screenchange-reload = true

[module/i3]
type = internal/i3
format = <label-state>

index-sort = true
pin-workspaces = true
strip-wsnumbers = true

enable-click = true
enable-scroll = false

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.workspace-active}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1
[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/japanese-date
interval = 1
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/pomodoro toggle
click-middle = ~/.config/polybar/scripts/pomodoro skip
click-right = ~/.config/polybar/scripts/pomodoro reset

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = vol %percentage%%
label-muted = mute
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network-status
interval = 3
format = <label>
label = %output%
click-left = kitty --class impala -e impala

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery-status
interval = 10
format = <label>
label = %output%

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro
interval = 1
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/pomodoro toggle
click-middle = ~/.config/polybar/scripts/pomodoro skip
click-right = ~/.config/polybar/scripts/pomodoro reset

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.blue}
click-left = ~/.config/polybar/scripts/open-vpn
click-right = ~/.config/polybar/scripts/disconnect-vpn

[module/containers]
type = custom/script
exec = ~/.config/polybar/scripts/containers-status
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.green}
click-left = ~/.config/polybar/scripts/open-containers
