backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.18;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Dunst'",
  "class_g = 'Rofi'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

corner-radius = 10;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
